name: Release plugin and Windows companion

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Normalize installer filename for the update checker
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $installer = Get-ChildItem -LiteralPath dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $expectedName = "Nova Fox Companion-Setup-$version.exe"
          if ($installer.Name -ne $expectedName) {
            Move-Item -LiteralPath $installer.FullName -Destination (Join-Path $installer.DirectoryName $expectedName)
          }
      - name: Package Git and plugin bundle
        shell: pwsh
        run: |
          $name = "Nova-Fox-Companion-Plugin-$env:GITHUB_REF_NAME.zip"
          git archive --format=zip --output="dist/$name" HEAD
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe, dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nova-fox-companion-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
